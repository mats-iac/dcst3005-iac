name: Drift dev

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sjekk:
    name: drift-sjekk dev
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: modul-8/terraform-projects/stacks/nettverk

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila for dev
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-nettverk-dev" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/modul-8/terraform-projects/shared/backend.hcl" \
            -backend-config="key=env/dev/nettverk.tfstate"

      - name: Plan med detaljert exit-kode
        id: plan
        run: |
          set +e
          terraform plan -lock=false -no-color -detailed-exitcode > plan.txt 2>&1
          kode=$?
          set -e
          cat plan.txt
          echo "kode=$kode" >> "$GITHUB_OUTPUT"

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars

      - name: Skriv sammendrag
        if: always()
        env:
          KODE: ${{ steps.plan.outputs.kode }}
        run: |
          {
            case "$KODE" in
              0) echo "## Ingen drift i dev" ;;
              2) echo "## Drift i dev - Azure stemmer ikke med main" ;;
              *) echo "## Drift-sjekken feilet - se loggen" ;;
            esac
            echo
            grep -E '^(Plan:|No changes)' plan.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rød ved drift
        env:
          KODE: ${{ steps.plan.outputs.kode }}
        run: |
          if [ "$KODE" != "0" ]; then
            echo "::error::Drift-sjekken ga exit-kode $KODE"
            exit 1
          fi
