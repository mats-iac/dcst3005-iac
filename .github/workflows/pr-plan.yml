
name: PR-plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'modul-5/terraform-projects/stacks/webapp/**'
      - '.github/workflows/pr-plan.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform plan - dev
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: modul-5/terraform-projects/stacks/webapp

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent tfvars fra Key Vault
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-dev" \
            --query value -o tsv > environment.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/modul-5/terraform-projects/shared/backend.hcl" \
            -backend-config="key=env/dev/webapp.tfstate"

      - name: Plan
        run: terraform plan -lock=false -no-color -var-file=environment.tfvars -out=tfplan

      - name: Legg planen som kommentar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Terraform plan - dev"
            echo
            echo "<details><summary>Vis hele planen</summary>"
            echo
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
            echo
            echo "</details>"
          } > "${{ github.workspace }}/kommentar.md"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "${{ github.workspace }}/kommentar.md"

      - name: Slett parameterfil
        if: always()
        run: rm -f environment.tfvars
