name: Terraform WebApp - Multi Environment

on:
  push:
    branches: [main]
    paths:
      - 'modul-5/terraform-projects/stacks/webapp/**'
      - '.github/workflows/webapp-multi-env.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: "Miljø - gjelder bare ved manuell kjøring"
        type: choice
        options: [dev, test, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: modul-5/terraform-projects/stacks/webapp

    env:
      MILJO: ${{ inputs.environment || 'dev' }}
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true
    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent tfvars fra Key Vault
        shell: bash
        run: |
          KV="${{ secrets.KEYVAULT_NAME }}"

          az keyvault secret show \
            --vault-name "$KV" \
            --name "tfvars-${{ env.MILJO }}" \
            --query value \
            -o tsv > environment.tfvars
        
      - name: Init
        shell: bash
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/modul-5/terraform-projects/shared/backend.hcl" \
            -backend-config="key=env/${{ env.MILJO }}/webapp.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -var-file=environment.tfvars

      - name: Apply
        run: terraform apply -auto-approve -var-file=environment.tfvars

      - name: Verifiser at appen svarer
        run: |
          URL=$(terraform output -raw webapp_url)
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "https://$URL" > /dev/null; then
              echo "Appen svarer på https://$URL"
              exit 0
            fi
            echo "Forsøk $i: ikke oppe ennå, venter..."
            sleep 15
          done
          echo "Appen svarte ikke innen tidsfristen"
          exit 1