
name: Terraform WebApp - Multi Environment

on:
  push:
    branches: [main]
    paths:
      - 'modul-5/terraform-projects/stacks/webapp/**'
      - '.github/workflows/webapp-multi-env.yml'
      - '.github/workflows/terraform-env.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: webapp
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/terraform-env.yml
    with:
      miljo: dev
      plan_miljo: dev
    secrets: inherit

  test:
    needs: dev
    uses: ./.github/workflows/terraform-env.yml
    with:
      miljo: test
      plan_miljo: test
    secrets: inherit

  prod:
    needs: test
    uses: ./.github/workflows/terraform-env.yml
    with:
      miljo: prod
      plan_miljo: prod-plan
    secrets: inherit
