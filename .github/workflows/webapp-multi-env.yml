name: Terraform WebApp - Multi Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Miljø som skal deployes"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: modul-5/terraform-projects/stacks/webapp

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true
    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: Hent tfvars fra Key Vault
        shell: bash
        run: |
          ENV="${{ inputs.environment }}"
          KV="${{ secrets.KEYVAULT_NAME }}"

          az keyvault secret show \
            --vault-name "$KV" \
            --name "tfvars-$ENV" \
            --query value \
            -o tsv > environment.tfvars