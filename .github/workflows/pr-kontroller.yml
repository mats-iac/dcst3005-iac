name: PR-kontroller

on:
  pull_request:
    branches: [main]
    paths:
      - 'modul-6/buildOnce-deployMany/simple-terraform/terraform/**'
      - '.github/workflows/pr-kontroller.yml'
      - '.github/workflows/pr-plan.yml'

permissions:
  contents: read

jobs:
  kontroller:
    name: fmt og validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      - name: Sjekk formatering
        working-directory: modul-6/buildOnce-deployMany/simple-terraform/terraform
        run: terraform fmt -check -recursive

      - name: Klargjør providere uten backend
        working-directory: modul-6/buildOnce-deployMany/simple-terraform/terraform
        run: terraform init -backend=false

      - name: Valider koden
        working-directory: modul-6/buildOnce-deployMany/simple-terraform/terraform
        run: terraform validate