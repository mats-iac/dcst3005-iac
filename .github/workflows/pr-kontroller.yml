
name: PR-kontroller

on:
  pull_request:
    branches: [main]
    paths:
      - 'modul-5/terraform-projects/**'
      - 'modul-8/terraform-projects/**'
      - '.github/workflows/drift.yml'
      - '.github/workflows/pr-kontroller.yml'

permissions:
  contents: read

jobs:
  kontroller:
    name: kodekontroll
    runs-on: ubuntu-latest

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Installer TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer Checkov
        run: pip install checkov==3.3.21

      - name: Valider modul 5
        run: bash modul-5/terraform-projects/scripts/valider.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Kontroller formatering i modul 8
        run: terraform -chdir=modul-8/terraform-projects fmt -check -recursive

      - name: Initialiser modul 8 uten backend
        run: terraform -chdir=modul-8/terraform-projects/stacks/nettverk init -backend=false

      - name: Valider modul 8
        run: terraform -chdir=modul-8/terraform-projects/stacks/nettverk validate
