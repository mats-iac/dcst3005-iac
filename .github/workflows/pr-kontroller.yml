name: PR-kontroller

on:
  pull_request:
    branches: [main]
    paths:
      - 'modul-5/terraform-projects/**'
      - '.github/workflows/pr-kontroller.yml'

permissions:
  contents: read

jobs:
  kontroller:
    name: kodekontroll
    runs-on: ubuntu-latest

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      - name: Installer TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer Checkov
        run: pip install checkov==3.3.21

      - name: Kjør valideringsskript
        run: bash modul-5/terraform-projects/scripts/valider.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}