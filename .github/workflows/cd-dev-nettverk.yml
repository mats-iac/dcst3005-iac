name: CD dev nettverk

on:
  push:
    branches: [main]
    paths:
      - 'modul-8/terraform-projects/**'
      - '.github/workflows/cd-dev-nettverk.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: nettverk-dev
  cancel-in-progress: false

jobs:
  rull-ut:
    name: Rull ut nettverk dev
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: modul-8/terraform-projects/stacks/nettverk

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila for dev
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-nettverk-dev" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/modul-8/terraform-projects/shared/backend.hcl" \
            -backend-config="key=env/dev/nettverk.tfstate"

      - name: Lag utrullingsplan
        run: terraform plan -out=tfplan

      - name: Rull ut
        run: terraform apply tfplan

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars
